{% extends "base.html" %}
{% block conteudo %}
<h2>Peças</h2>
<form method="get"><input name="busca" value="{{ busca }}" placeholder="Buscar pelo nome"> <button>Buscar</button></form>
<p>{{ pecas|length }} peça(s) encontrada(s).</p>
<table>
  <tr><th>Código</th><th>Nome</th><th>Qtd.</th><th>Mín.</th><th>Preço</th><th>Local</th><th>Ações</th></tr>
  {% for p in pecas %}
  <tr>
    <td>{{ p.codigo }}</td><td>{{ p.nome }}</td><td>{{ p.quantidade }}</td><td>{{ p.minimo }}</td>
    <td>R$ {{ "%.2f"|format(p.preco) }}</td><td>{{ p.localizacao }}</td>
    <td>
      <form method="post" action="{{ url_for('dar_baixa', peca_id=p.id) }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input name="quantidade" type="number" min="1" step="1" value="1" required style="width:60px"> <button>Dar baixa</button>
      </form>
      <form method="post" action="{{ url_for('excluir_peca', peca_id=p.id) }}" style="display:inline" onsubmit="return confirm('Excluir esta peça?')">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Excluir</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
