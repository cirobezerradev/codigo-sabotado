{% extends "base.html" %}
{% block conteudo %}
<h2>Nova peça</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <p><input name="codigo" placeholder="Código" required></p>
  <p><input name="nome" placeholder="Nome" required></p>
  <p><input name="quantidade" type="number" min="0" step="1" placeholder="Quantidade" required></p>
  <p><input name="minimo" type="number" min="0" step="1" placeholder="Estoque mínimo" required></p>
  <p><input name="preco" type="number" min="0" step="0.01" placeholder="Preço unitário" required></p>
  <p><input name="localizacao" placeholder="Localização" required></p>
  <button>Cadastrar</button>
</form>
{% endblock %}
